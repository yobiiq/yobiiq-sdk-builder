name: Build and Push Docker Image

on:
  workflow_dispatch:
    inputs:
      tag_version:
        description: 'NCS version to build (e.g., v3.5.0-preview4), empty for VERSION.txt'
        required: false
        default: ''
      rebuild:
        description: 'Replace an exact version tag that is already published'
        type: boolean
        required: false
        default: false
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - '.github/workflows/build-and-push.yml'
      - 'VERSION.txt'
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Convert repository name to lowercase
        id: repo
        run: |
          echo "image_name=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
      
      - name: Read version from VERSION.txt
        id: version
        env:
          TAG_VERSION: ${{ inputs.tag_version }}
        run: |
          FILE_VERSION=$(grep NRF_CONNECT_SDK_VERSION VERSION.txt | cut -d'=' -f2)
          NCS_VERSION="${TAG_VERSION:-$FILE_VERSION}"
          if ! [[ "${NCS_VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid NCS version: ${NCS_VERSION}"
            exit 1
          fi
          # Only a released version from VERSION.txt moves the tags shared between builds
          if [[ "${NCS_VERSION}" == "${FILE_VERSION}" && "${NCS_VERSION}" != *-* ]]; then
            echo "moving_tags=true" >> $GITHUB_OUTPUT
          else
            echo "moving_tags=false" >> $GITHUB_OUTPUT
          fi
          echo "ncs_version=${NCS_VERSION}" >> $GITHUB_OUTPUT
          echo "image_tag=${NCS_VERSION}" >> $GITHUB_OUTPUT
          # Extract major.minor version (e.g., v3.2 from v3.2.1)
          MAJOR_MINOR=$(echo ${NCS_VERSION} | sed -E 's/(v[0-9]+\.[0-9]+).*/\1/')
          echo "major_minor=${MAJOR_MINOR}" >> $GITHUB_OUTPUT
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Check whether the version is already published
        id: published
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ steps.repo.outputs.image_name }}:${{ steps.version.outputs.image_tag }}
          REBUILD: ${{ inputs.rebuild }}
        run: |
          # An exact version tag is what the SDK workflows pin: never replace it by accident
          if [[ "${REBUILD}" == "true" ]]; then
            echo "skip=false" >> $GITHUB_OUTPUT
          elif output=$(docker manifest inspect "${IMAGE}" 2>&1); then
            echo "${IMAGE} is already published, nothing to do. Run the workflow by hand with rebuild to replace it." >> $GITHUB_STEP_SUMMARY
            echo "skip=true" >> $GITHUB_OUTPUT
          elif [[ "${output}" == *"manifest unknown"* ]]; then
            echo "skip=false" >> $GITHUB_OUTPUT
          else
            echo "Cannot tell whether ${IMAGE} is published: ${output}"
            exit 1
          fi

      - name: Extract metadata for Docker
        if: steps.published.outputs.skip != 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo.outputs.image_name }}
          tags: |
            type=raw,value=${{ steps.version.outputs.image_tag }}
            type=raw,value=${{ steps.version.outputs.major_minor }},enable=${{ steps.version.outputs.moving_tags }}
            type=raw,value=latest,enable=${{ steps.version.outputs.moving_tags }}
            type=sha,prefix=sha-,enable=${{ steps.version.outputs.moving_tags }}
      
      - name: Build Docker image
        if: steps.published.outputs.skip != 'true'
        uses: docker/build-push-action@v5
        timeout-minutes: 120
        with:
          context: .
          load: true
          tags: ${{ steps.repo.outputs.image_name }}:verify
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            NCS_VERSION=${{ steps.version.outputs.ncs_version }}
            BUILDKIT_INLINE_CACHE=1
            PIP_NO_CACHE_DIR=1

      - name: Run image verification
        if: steps.published.outputs.skip != 'true'
        run: ./scripts/verify-image.sh "${{ steps.repo.outputs.image_name }}:verify" "${{ steps.version.outputs.ncs_version }}"

      - name: Push Docker image
        if: steps.published.outputs.skip != 'true'
        env:
          VERIFIED_IMAGE: ${{ steps.repo.outputs.image_name }}:verify
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          # Push the image that passed verification, never a second build of it
          for tag in ${TAGS}; do
            docker tag "${VERIFIED_IMAGE}" "${tag}"
            docker push "${tag}"
          done

      - name: Create summary
        if: steps.published.outputs.skip != 'true'
        run: |
          echo "## Docker Image Built Successfully :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" | sed 's/.*:/- /' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**nRF Connect SDK Version:** ${{ steps.version.outputs.ncs_version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pull Command" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
